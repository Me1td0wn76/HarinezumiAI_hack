services:
  db:
    image: postgres:17-alpine
    container_name: lt-db
    environment:
      POSTGRES_USER: lt
      POSTGRES_PASSWORD: lt
      POSTGRES_DB: lt
    ports:
      - "5432:5432"
    volumes:
      - lt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lt -d lt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lt-db-data:

name: Slides

# 発表資料（slides/ の Slidev）をビルドして GitHub Pages に公開する。
# 公開先: https://<owner>.github.io/<repo>/
# 初回だけ、リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にしておく。

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。途中の公開は取り消さず、最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # slides/ はアプリの workspace に含めていない（独自の pnpm-workspace.yaml と lockfile を持つ）ので、
    # インストールもビルドも slides/ の中で行う
    defaults:
      run:
        working-directory: slides

    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンはルートの package.json の packageManager を使う
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Slidev は Node 22.12 以上が必要
          node-version: 22
          cache: pnpm
          cache-dependency-path: slides/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Pages はサブパス（/<repo>/）で配信されるので base を合わせる
      - name: Slidev をビルド
        run: pnpm exec slidev build --base "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
